<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Images</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .card { border: 1px solid #ccc; padding: 10px; border-radius: 8px; text-align: center; }
    img { max-width: 100%; height: auto; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Candidate Images</h1>
  <div class="grid">
    <div class="card">
      <h3>new-img02.png</h3>
      <img src="assets/img/new-img02.png" />
    </div>
    <div class="card">
      <h3>new-img03.png</h3>
      <img src="assets/img/new-img03.png" />
    </div>
    <div class="card">
      <h3>new-img04.png</h3>
      <img src="assets/img/new-img04.png" />
    </div>
    <div class="card">
      <h3>new-img08.png</h3>
      <img src="assets/img/new-img08.png" />
    </div>
    <div class="card">
      <h3>stadium-turf.png</h3>
      <img src="assets/img/bg/stadium-turf.png" />
    </div>
    <div class="card">
      <h3>stadium.png</h3>
      <img src="assets/img/bg/stadium.png" />
    </div>
  </div>
</body>
</html>
